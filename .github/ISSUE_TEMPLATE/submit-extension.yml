name: Submit an extension
description: List a Kubb plugin, adapter, or parser in the Kubb extension registry.
title: 'submit: '
labels: ['submission']
body:
  - type: markdown
    attributes:
      value: |
        Intake opens a pull request with the record. A maintainer reviews the package against [REVIEW.md](https://github.com/kubb-labs/registry/blob/main/REVIEW.md) before it is listed.

        Ship a `kubb-extension.json` at the package root and a `docs/` folder with `overview.md`, plus an optional `options.md` and `guides/`. See the [registry README](https://github.com/kubb-labs/registry#submit-an-extension).
  - type: input
    id: source
    attributes:
      label: Source
      description: |
        Where the extension lives. Examples:
        - npm package: `@acme/kubb-plugin-graphql` (uses the `latest` version)
        - npm package with a version: `@acme/kubb-plugin-graphql@1.2.3`
        - npm page: `https://www.npmjs.com/package/@acme/kubb-plugin-graphql`
        - GitHub package folder (published on npm): `https://github.com/acme/kubb-plugins/tree/main/packages/graphql`
        - GitHub release (not on npm, package at the repository root): `https://github.com/acme/kubb-plugin-graphql/tree/v1.2.0`, or the repository root for the latest release
      placeholder: 'https://github.com/acme/kubb-plugins/tree/main/packages/graphql'
    validations:
      required: true
  - type: checkboxes
    id: categories
    attributes:
      label: Categories
      description: What does it do? Tick everything that fits. The first tick is the main one.
      options:
        - label: Types
        - label: Validation
        - label: Client
        - label: Framework
        - label: Mocks
        - label: Testing
        - label: Documentation
        - label: AI
        - label: Output
        - label: OpenAPI
        - label: TypeScript
        - label: Docs
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the reviewer should know.
    validations:
      required: false
