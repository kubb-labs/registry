name: Smoke

# Submit dispatches this on the `submission/<issue>` branch after it opens the review pull request.
# A maintainer can also run it on that branch. It runs the submitted package, so the load job has no
# token, no secrets, and no cache: caches written here stay scoped to the submission branch.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Record id, such as acme/plugin-graphql'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Load the extension
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install and load the extension
        env:
          ID: ${{ inputs.id }}
          DIR: ${{ runner.temp }}/smoke
        run: |
          mkdir "$DIR"
          node scripts/smoke.ts --id "$ID" --dir "$DIR"

  report:
    name: Report the load check
    needs: load
    if: always() && (needs.load.result == 'success' || needs.load.result == 'failure')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      RESULT: ${{ needs.load.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the pull request
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            body="Load check passed: the manifest's \`export\` loads, and its \`meta.name\` matches. [Logs]($RUN_URL)"
          else
            body="Load check failed: the package did not install or load as its manifest says. See the [logs]($RUN_URL)."
          fi
          gh pr comment "$pr" --body "$body"
