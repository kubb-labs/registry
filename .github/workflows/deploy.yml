name: Deploy

# kubb.dev clones this repository on every deploy, runs `pnpm build`, and serves dist/ at
# https://kubb.dev/registry, so a change here only needs a kubb.dev redeploy.
on:
  push:
    branches: [main]
    paths:
      - extensions/**
      - categories.json
      - schemas/**
      - scripts/**
      - package.json
  schedule:
    # Daily at 05:43 UTC, so download and star counts stay current.
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  deploy-platform:
    name: Dispatch content-updated to platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          repository: kubb-labs/platform
          event-type: content-updated
          client-payload: '{"source": "registry", "ref": "${{ github.ref_name }}"}'
