name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so --changed can compare records with the merge base.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          cache: 'false'

      - name: Type check, lint, check formatting, and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test

      # Every record offline, and the changed ones against their pinned versions. No extension code runs.
      - name: Validate records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm validate --online --changed --base "$BASE_REF"
          else
            pnpm validate
          fi
