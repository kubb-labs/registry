name: Bump

on:
  workflow_dispatch:
  # Sent by the kubb-labs/plugins Release workflow once a release reaches npm `latest`.
  repository_dispatch:
    types: [plugins-released]
  schedule:
    # Mondays at 06:17 UTC.
    - cron: '17 6 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump pinned versions
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.repository_owner == 'kubb-labs'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main
        with:
          cache: 'false'

      - name: Move pins to the latest version
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/bump.md
        # A plugins release bumps only that repository's records, on its own branch.
        run: pnpm bump ${{ github.event_name == 'repository_dispatch' && '--repo kubb-labs/plugins' || '' }}

      - name: Open the pull request
        if: steps.bump.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ github.event_name == 'repository_dispatch' && 'bump-plugins' || 'bump' }}
          add-paths: extensions/**
          commit-message: 'chore: bump pinned versions'
          title: 'chore: bump pinned versions'
          body-path: ${{ runner.temp }}/bump.md
          delete-branch: true
