name: Publish

on:
  push:
    branches: [main]
    paths:
      - extensions/**
      - categories.json
      - schemas/**
      - scripts/**
      - package.json
      - .github/workflows/publish.yml
  schedule:
    # Daily at 05:43 UTC, so download and star counts stay current.
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@f1710c1732b46c33bf590d8ff1ac59bf17a53247 # main
        with:
          cache: 'false'

      # Reads each pinned npm tarball. No extension code is installed or run.
      - name: Build the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  pages:
    name: Deploy to GitHub Pages
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Releases dist/ as @kubb/registry, like @nuxt/modules, for CDNs and package consumers. Only record
  # changes release; the daily run refreshes the counts on Pages alone. Turned on with the repository
  # variable NPM_RELEASE=true once npm trusts this workflow for @kubb/registry.
  npm:
    name: Release to npm
    needs: build
    if: github.event_name != 'schedule' && vars.NPM_RELEASE == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      # id-token: write enables npm OIDC trusted publishing, so no NPM_TOKEN is needed.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@f1710c1732b46c33bf590d8ff1ac59bf17a53247 # main
        with:
          cache: 'false'
          force-install: 'true'

      # The dist/ the build job made for Pages, so npm and Pages ship the same files.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}

      # Every release is a new minor version, numbered by this workflow's run.
      - name: Publish
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir dist && tar -xf "$RUNNER_TEMP/artifact.tar" -C dist
          pnpm version "0.$RUN_NUMBER.0" --no-git-tag-version
          pnpm publish --no-git-checks
