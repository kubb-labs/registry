name: Publish

on:
  push:
    branches: [main]
    paths:
      - extensions/**
      - categories.json
      - schemas/**
      - scripts/**
      - package.json
      - .github/workflows/publish.yml
  schedule:
    # Daily at 05:43 UTC, so download and star counts stay current.
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      # Pushes dist/ to the dist branch.
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@f1710c1732b46c33bf590d8ff1ac59bf17a53247 # main
        with:
          cache: 'false'

      # Reads each pinned npm tarball. No extension code is installed or run.
      - name: Build the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      # kubb.dev clones this branch on every deploy and serves it at https://kubb.dev/registry. The
      # branch holds one commit, replaced on every run, so it never grows.
      - name: Push dist/ to the dist branch
        run: |
          git -C dist init --quiet --initial-branch=dist
          git -C dist add --all
          git -C dist -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "build: registry from ${GITHUB_SHA}"
          git fetch --quiet ./dist dist
          git push --force origin FETCH_HEAD:refs/heads/dist

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry
          # Hidden files, such as dist/.git, are left out by default.
          path: dist

      # kubb.dev serves the dist branch it cloned at build time, so it redeploys to pick up this one.
      - name: Redeploy kubb.dev
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          repository: kubb-labs/platform
          event-type: content-updated
          client-payload: '{"source": "registry", "sha": "${{ github.sha }}"}'

  # Releases dist/ as @kubb/registry, like @nuxt/modules, for CDNs and package consumers. Only record
  # changes release; the daily run refreshes the counts on kubb.dev alone. Turned on with the
  # repository variable NPM_RELEASE=true once npm trusts this workflow for @kubb/registry.
  npm:
    name: Release to npm
    needs: build
    if: github.event_name != 'schedule' && vars.NPM_RELEASE == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      # id-token: write enables npm OIDC trusted publishing, so no NPM_TOKEN is needed.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@f1710c1732b46c33bf590d8ff1ac59bf17a53247 # main
        with:
          cache: 'false'
          force-install: 'true'

      # The dist/ the build job pushed to the dist branch, so npm and kubb.dev ship the same files.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: dist

      # Every release is a new minor version, numbered by this workflow's run.
      - name: Publish
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pnpm version "0.$RUN_NUMBER.0" --no-git-tag-version
          pnpm publish --no-git-checks
